<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Paul AUTOS</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; --line:#e2e0da; --danger:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#121214; --card:#1c1c20; --text:#f2f2f4; --muted:#9a9aa3; --line:#2c2c33; --danger:#ef5350; }
  }
  :root[data-theme="dark"] { --bg:#121214; --card:#1c1c20; --text:#f2f2f4; --muted:#9a9aa3; --line:#2c2c33; --danger:#ef5350; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { font-size:18px; margin:0; }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  input[type=search] { flex:1; min-width:180px; }
  main { padding:16px; max-width:900px; margin:0 auto; }
  .row { display:flex; gap:12px; align-items:center; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); margin-bottom:8px; }
  .row img { width:72px; height:54px; object-fit:cover; border-radius:6px; background:var(--line); flex-shrink:0; }
  .info { flex:1; min-width:0; }
  .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--danger); background:transparent; color:var(--danger); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .acts { display:flex; gap:8px; flex-shrink:0; }
  button.sold { border-color:#15803d; color:#15803d; }
  button.price { border-color:#1d4ed8; color:#1d4ed8; }
  button.cancel { border-color:var(--line); color:var(--muted); }
  .rebajado { display:inline-block; margin-left:8px; font-size:11px; font-weight:600; color:#fff; background:#e53935; padding:2px 8px; border-radius:10px; }
  .pedit { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; font-weight:600; }
  .pedit input { width:130px; padding:7px 10px; }
  @media (max-width:520px) { .acts { flex-direction:column; } }
  .status { margin:12px 0; font-size:14px; color:var(--muted); min-height:20px; }
  .prov { display:inline-block; margin-left:6px; font-size:12px; font-weight:600; color:#1d4ed8; }
  .tipo { display:inline-block; margin-left:8px; font-size:11px; font-weight:600; color:#7c3aed; background:#ede9fe; padding:2px 8px; border-radius:10px; vertical-align:middle; }
  .dup { display:inline-block; margin-left:8px; font-size:11px; font-weight:600; color:#b45309; background:#fef3c7; padding:2px 8px; border-radius:10px; vertical-align:middle; }
  .status.err { color:var(--danger); }
  @media (max-width:520px) { header { flex-direction:column; align-items:stretch; } }
</style>
</head>
<body>
<header>
  <h1>Admin — eliminar vehículos</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input type="password" id="pwd" placeholder="Contraseña de admin" autocomplete="current-password">
    <button id="provBtn" type="button" style="border-color:var(--line);color:var(--text)">Ver proveedores</button>
  </div>
</header>
<main>
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
    <input type="search" id="q" placeholder="Buscar en la lista..." style="flex:1;box-sizing:border-box">
    <label style="display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap;cursor:pointer"><input type="checkbox" id="dups"> Solo duplicados exactos <span title="Autos con el mismo título, precio, año y kilómetros" style="color:var(--muted);cursor:help">(?)</span></label>
  </div>
  <div class="status" id="status">Cargando vehículos...</div>
  <div id="list"></div>
</main>
<script>
  let vehicles = [];
  let proveedores = {};
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  const qEl = document.getElementById('q');
  const pwdEl = document.getElementById('pwd');
  const dupEl = document.getElementById('dups');

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  function dupKey(v) {
    return [v.title, v.price, v.year, v.kms].join('|').toLowerCase();
  }

  function render() {
    const term = qEl.value.trim().toLowerCase();
    const counts = {};
    for (const v of vehicles) counts[dupKey(v)] = (counts[dupKey(v)] || 0) + 1;
    const onlyDup = dupEl.checked;
    let shown = vehicles.filter(v => !term || (v.title || '').toLowerCase().includes(term));
    if (onlyDup) shown = shown.filter(v => counts[dupKey(v)] > 1);
    shown.sort((a, b) => dupKey(a).localeCompare(dupKey(b)));
    listEl.textContent = '';
    for (const v of shown) {
      const row = document.createElement('div');
      row.className = 'row';

      const img = document.createElement('img');
      img.src = v.img || '';
      img.alt = '';
      img.loading = 'lazy';
      row.appendChild(img);

      const info = document.createElement('div');
      info.className = 'info';
      const t = document.createElement('div');
      t.className = 'title';
      t.textContent = v.title || '(sin titulo)';
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = [v.dealer, v.year, v.price, v.kms].filter(Boolean).join(' · ');
      if (v.priceBefore && parseInt(String(v.priceBefore).replace(/\D/g, '')) > parseInt(String(v.price).replace(/\D/g, ''))) {
        const rb = document.createElement('span');
        rb.className = 'rebajado';
        rb.textContent = `Rebajado (antes ${v.priceBefore})`;
        m.appendChild(rb);
      }
      const pv = proveedores[v.id];
      if (pv && pv.proveedor) {
        const sp = document.createElement('span');
        sp.className = 'prov';
        sp.textContent = `· Proveedor: ${pv.proveedor}`;
        sp.title = [pv.fuente, pv.fecha].filter(Boolean).join(' · ');
        m.appendChild(sp);
      }
      if (v.tipo === 'moto') {
        const tp = document.createElement('span');
        tp.className = 'tipo';
        tp.textContent = 'Moto';
        t.appendChild(tp);
      }
      info.append(t, m);
      const n = counts[dupKey(v)];
      if (n > 1) {
        const badge = document.createElement('span');
        badge.className = 'dup';
        badge.textContent = `Duplicado x${n}`;
        t.appendChild(badge);
      }
      row.appendChild(info);

      const acts = document.createElement('div');
      acts.className = 'acts';
      const sold = document.createElement('button');
      sold.className = 'sold';
      sold.textContent = 'Vendido';
      sold.title = 'Se quita de la web y no vuelve aunque se reenvie al grupo';
      sold.addEventListener('click', () => removeVehicle(v, sold, 'vendido'));
      const btn = document.createElement('button');
      btn.textContent = 'Eliminar';
      btn.title = 'Error o duplicado: se quita de la web; vuelve si se publica de nuevo despues';
      btn.addEventListener('click', () => removeVehicle(v, btn, 'eliminado'));
      const pr = document.createElement('button');
      pr.className = 'price';
      pr.textContent = 'Precio';
      pr.title = 'Cambiar el precio (si baja, sale la etiqueta "Rebajado")';
      pr.addEventListener('click', () => editPrice(v, row, info));
      acts.append(pr, sold, btn);
      row.appendChild(acts);

      listEl.appendChild(row);
    }
    setStatus(`${shown.length} de ${vehicles.length} vehículos`);
  }

  async function removeVehicle(v, btn, reason) {
    const password = pwdEl.value;
    if (!password) { setStatus('Escribe la contraseña de admin primero.', true); pwdEl.focus(); return; }
    const vendido = reason === 'vendido';
    const msg = vendido
      ? `¿Marcar "${v.title}" como VENDIDO? Se quita del catálogo y no vuelve a aparecer, aunque lo reenvíen al grupo.`
      : `¿Eliminar "${v.title}" del catálogo? (error o duplicado) Si el proveedor lo vuelve a publicar después, volverá a aparecer.`;
    if (!confirm(msg)) return;
    const label = btn.textContent;

    btn.disabled = true;
    btn.textContent = vendido ? 'Marcando...' : 'Eliminando...';
    try {
      const res = await fetch('/api/admin/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: v.id, password, reason }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      vehicles = vehicles.filter(x => x.id !== v.id);
      render();
      setStatus(`${vendido ? 'Vendido' : 'Eliminado'}: ${v.title}. El cambio se publicará en unos segundos.`);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = label;
      setStatus(e.message, true);
    }
  }

  // ---- cambiar precio
  function editPrice(v, row, info) {
    if (row.querySelector('.pedit')) return;
    const box = document.createElement('div');
    box.className = 'pedit';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric';
    inp.value = String(v.price || '').replace(/[^0-9]/g, '');
    inp.placeholder = 'Nuevo precio, ej. 14500';
    const ok = document.createElement('button'); ok.textContent = 'Guardar'; ok.className = 'price';
    const no = document.createElement('button'); no.textContent = 'Cancelar'; no.className = 'cancel';
    box.append('$', inp, ok, no);
    info.appendChild(box);
    inp.focus(); inp.select();
    no.addEventListener('click', () => box.remove());
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok.click(); if (e.key === 'Escape') box.remove(); });
    ok.addEventListener('click', async () => {
      const password = pwdEl.value;
      if (!password) { setStatus('Escribe la contraseña de admin primero.', true); pwdEl.focus(); return; }
      const n = parseInt(inp.value.replace(/\D/g, ''), 10);
      if (!n || n < 300) { setStatus('Escribe un precio válido.', true); inp.focus(); return; }
      ok.disabled = true; ok.textContent = 'Guardando...';
      try {
        const res = await fetch('/api/admin/price', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: v.id, password, price: n }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
        const antes = v.price;
        v.price = data.price;
        if (data.priceBefore) v.priceBefore = data.priceBefore; else delete v.priceBefore;
        render();
        setStatus(`${v.title}: ${antes} → ${v.price}${data.priceBefore ? ' (sale como Rebajado)' : ''}. Se verá en la web en unos segundos.`);
      } catch (e) {
        ok.disabled = false; ok.textContent = 'Guardar';
        setStatus(e.message, true);
      }
    });
  }

  async function loadProveedores() {
    const password = pwdEl.value;
    if (!password) { setStatus('Escribe la contraseña de admin primero.', true); pwdEl.focus(); return; }
    setStatus('Cargando proveedores...');
    try {
      const res = await fetch('/api/admin/proveedores', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      proveedores = data.proveedores || {};
      render();
      setStatus(`${Object.keys(proveedores).length} vehículos con proveedor registrado · ${statusEl.textContent}`);
    } catch (e) { setStatus(e.message, true); }
  }
  document.getElementById('provBtn').addEventListener('click', loadProveedores);

  qEl.addEventListener('input', render);
  dupEl.addEventListener('change', render);

  (async () => {
    try {
      const res = await fetch('/vehicles.json', { cache: 'no-store' });
      const data = await res.json();
      vehicles = data.vehicles || [];
      render();
    } catch (e) {
      setStatus('No se pudo cargar el catálogo.', true);
    }
  })();
</script>
</body>
</html>
